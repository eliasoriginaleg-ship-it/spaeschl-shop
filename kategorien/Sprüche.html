<main>
    <h1>Sprüche</h1>

    <p><a href="../index.html">Zur Übersicht</a></p>

    <div class="gallery" style="display:flex; gap:20px; flex-wrap:wrap;">

    <img src="../bilder/Sprüche_1.jpeg"
         width="350" height="350"
         style="object-fit:contain; border:1px solid black; pointer-events:none; user-select:none;"
     draggable="false"
     oncontextmenu="return false;">

    <img src="../bilder/Sprüche_2.jpeg"
         width="350" height="350"
         style="object-fit:contain; border:1px solid black; pointer-events:none; user-select:none;"
     draggable="false"
     oncontextmenu="return false;">

    <img src="../bilder/Sprüche_3.jpeg"
         width="350" height="350"
         style="object-fit:contain; border:1px solid black; pointer-events:none; user-select:none;"
     draggable="false"
     oncontextmenu="return false;">

</div>


</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const images = document.querySelectorAll(".gallery img");

    images.forEach((img) => {

        // Wrapper erstellen
        const wrapper = document.createElement("div");
        wrapper.style.position = "relative";
        wrapper.style.overflow = "hidden";

        // ALLE BILDER GLEICH GROSS
        const size = 280;  // ← HIER EINSTELLEN (z.B. 280 oder 380)
        wrapper.style.width = size + "px";
        wrapper.style.height = size + "px";

        // Bild ersetzen
        img.parentNode.insertBefore(wrapper, img);
        wrapper.appendChild(img);

        // Bildgröße festlegen
        img.style.width = size + "px";
        img.style.height = size + "px";
        img.style.objectFit = "contain";
        img.style.background = "#000";

        // Bild schützen
        img.style.pointerEvents = "none";
        img.style.userSelect = "none";
        img.style.webkitUserDrag = "none";

        // ============================================
        // GROSSES DIAGONALES WASSERZEICHEN
        // ============================================
        const wm = document.createElement("div");
        wm.textContent = "© Elias Gstrein";
        wm.style.position = "absolute";
        wm.style.top = "50%";
        wm.style.left = "50%";
        wm.style.transform = "translate(-50%, -50%) rotate(-25deg)";
        wm.style.fontSize = (size * 0.25) + "px";  // etwas größer für perfekte Mitte
        wm.style.color = "rgba(255,255,255,0.15)";
        wm.style.textShadow = "0 0 6px rgba(0,0,0,0.7)";
        wm.style.pointerEvents = "none";
        wm.style.whiteSpace = "nowrap";
        wrapper.appendChild(wm);

        // ============================================
        // KLEINES WASSERZEICHEN UNTEN RECHTS
        // ============================================
        const wmSmall = document.createElement("div");
        wmSmall.textContent = "© Elias Gstrein";
        wmSmall.style.position = "absolute";
        wmSmall.style.bottom = "10px";
        wmSmall.style.right = "10px";
        wmSmall.style.fontSize = (size * 0.08) + "px";
        wmSmall.style.color = "rgba(255,255,255,0.85)";
        wmSmall.style.textShadow = "0 0 4px rgba(0,0,0,0.8)";
        wmSmall.style.pointerEvents = "none";
        wrapper.appendChild(wmSmall);

    });

});
</script>
